<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Grocery List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column. Sticky add bar on top, aisle-sign headers over white item cards, "Picked up" pinned as the last aisle. */
:root {
  --bg: #edf1ef;
  --surface: #ffffff;
  --ink: #13201b;
  --muted: #586861;
  --line: #d3dcd8;
  --accent: #1b4fcb;
  --on-accent: #ffffff;
  --sign: #1b4fcb;
  --sign-done: #5c6b66;
  --danger: #b3261e;
  --f-sign: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #17201c; --ink: #e6eeea; --muted: #8fa19a; --line: #28332f;
    --accent: #7ba3ff; --on-accent: #0b1224; --sign: #2a55c7; --sign-done: #3a4743; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #17201c; --ink: #e6eeea; --muted: #8fa19a; --line: #28332f;
  --accent: #7ba3ff; --on-accent: #0b1224; --sign: #2a55c7; --sign-done: #3a4743; --danger: #ff8a80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 var(--f-body);
  padding-inline: 16px;
  padding-block: 0 48px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 560px; margin-inline: auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus, var(--accent)); outline-offset: 2px; }

.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding-block: 14px 10px;
  border-bottom: 1px solid var(--line);
}
.titlerow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
h1 { margin: 0; font: 700 28px/1 var(--f-sign); letter-spacing: .04em; text-transform: uppercase; }
.summary { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.field {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  min-height: 48px;
  padding: 0 12px;
  font-size: 16px;
  min-width: 0;
}
#item { grid-column: 1 / -1; }
.add {
  min-height: 48px;
  padding: 0 22px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
}

.hint { margin: 14px 0 0; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.link { background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.empty { margin: 28px 0 8px; color: var(--muted); text-align: center; }
.aisle { margin-top: 20px; }
.sign {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--sign);
  color: #fff;
  font: 600 18px/1 var(--f-sign);
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 9px 12px;
  border-radius: 6px 6px 0 0;
  min-height: 38px;
}
.sign.done { background: var(--sign-done); }
.sign .n { font-variant-numeric: tabular-nums; letter-spacing: .04em; opacity: .9; }
.sign .clear {
  background: transparent; border: 1px solid rgba(255, 255, 255, .6); color: #fff;
  font: 600 14px/1 var(--f-sign); letter-spacing: .1em; text-transform: uppercase;
  padding: 7px 10px; border-radius: 4px; min-height: 30px;
}
.sign .clear.arm { background: #fff; color: #7a1710; border-color: #fff; }

ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; }
li + li { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; min-height: 54px; padding-right: 4px; }
.hit { width: 48px; height: 48px; flex: none; display: grid; place-items: center; background: none; border: 0; padding: 0; }
.chk {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--accent);
  display: grid; place-items: center;
  color: var(--on-accent);
}
.done .chk { background: var(--accent); }
.chk svg { opacity: 0; }
.done .chk svg { opacity: 1; }
.name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 17px; padding-block: 6px; }
.done .name { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.tag { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-right: 8px; text-align: right; max-width: 38%; }
.more { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: none; border: 0; color: var(--muted); border-radius: 8px; }
.edit { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 12px 14px 48px; }
.edit select { flex: 1 1 160px; min-height: 44px; }
.edit button { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.edit .del { color: var(--danger); }

@media (prefers-reduced-motion: no-preference) {
  .row { animation: land .22s ease-out; }
  @keyframes land { from { transform: translateY(-6px); } to { transform: none; } }
}
</style>

<div class="wrap">
  <div class="bar">
    <div class="titlerow">
      <h1>Grocery List</h1>
      <p class="summary" id="summary" aria-live="polite"></p>
    </div>
    <form id="add" autocomplete="off">
      <label class="vh" for="item">Add an item</label>
      <input class="field" id="item" type="text" placeholder="Add an item (or a few, separated by commas)" enterkeyhint="done" autocapitalize="sentences">
      <label class="vh" for="cat">Category</label>
      <select class="field" id="cat"></select>
      <button class="add" type="submit">Add</button>
    </form>
  </div>
  <div id="list"></div>
</div>

<script>
(function () {
  var CATS = ['Produce', 'Bakery', 'Meat & Seafood', 'Deli', 'Dairy & Eggs', 'Frozen', 'Pantry', 'Snacks', 'Beverages', 'Household', 'Personal care', 'Other'];

  // Matching order matters: more specific rules run before general ones ("peanut butter" before "butter").
  // A leading ~ means "word starts with" (so ~strawberr matches strawberry and strawberries).
  var RULES = [
    ['Produce', ['green bean', 'bean sprout']],
    ['Frozen', ['frozen', 'ice cream', 'popsicle', 'gelato', 'sorbet', 'pizza', 'fries', 'tater tot', 'ice']],
    ['Household', ['paper towel', 'toilet paper', 'tissue', 'napkin', 'dish soap', 'detergent', 'laundry', 'bleach', 'trash bag', 'garbage bag', 'sponge', 'foil', 'plastic wrap', 'parchment', 'ziploc', 'battery', 'light bulb', 'cleaner', 'windex', 'dishwasher', 'fabric softener']],
    ['Personal care', ['shampoo', 'conditioner', 'soap', 'body wash', 'toothpaste', 'toothbrush', 'deodorant', 'razor', 'lotion', 'sunscreen', 'floss', 'mouthwash', 'tampon', 'vitamin', 'ibuprofen', 'tylenol', 'advil', 'band aid', 'bandage', 'cotton ball', 'contact solution']],
    ['Pantry', ['rice', 'pasta', 'spaghetti', 'noodle', 'macaroni', 'flour', 'sugar', 'salt', 'black pepper', 'oil', 'vinegar', 'sauce', 'ketchup', 'mustard', 'mayo', 'mayonnaise', 'soup', 'broth', 'stock', 'bean', 'lentil', 'chickpea', 'canned', 'tuna', 'cereal', 'oats', 'oatmeal', 'peanut butter', 'almond butter', 'nut butter', 'jam', 'jelly', 'honey', 'syrup', 'spice', 'cinnamon', 'baking soda', 'baking powder', 'yeast', 'tomato paste', 'salsa', 'coconut milk', 'nutella', 'chocolate chip', 'cocoa', 'protein powder', 'bbq', 'quinoa', 'couscous', 'breadcrumb', 'bread crumb', 'stuffing', 'gravy', 'pickle', 'relish', 'cooking spray']],
    ['Bakery', ['bread', 'bagel', 'bun', 'roll', 'croissant', 'muffin', 'tortilla', 'pita', 'naan', 'baguette', 'cake', 'donut', 'doughnut', 'pie', 'wrap', 'sourdough', 'cupcake', 'brioche', 'danish', 'scone']],
    ['Dairy & Eggs', ['milk', 'cheese', 'butter', 'yogurt', 'yoghurt', 'cream', 'creamer', 'egg', 'margarine', 'kefir', 'half and half', 'parmesan', 'mozzarella', 'cheddar', 'feta', 'ricotta', 'brie', 'tofu']],
    ['Beverages', ['juice', 'soda', 'pop', 'cola', 'water', 'sparkling', 'coffee', 'tea', 'beer', 'wine', 'cider', 'lemonade', 'kombucha', 'energy drink', 'gatorade', 'seltzer', 'drink', 'whiskey', 'vodka']],
    ['Deli', ['deli', 'salami', 'prosciutto', 'pepperoni', 'lunch meat', 'cold cut', 'hummus', 'olive', 'rotisserie', 'pastrami', 'mortadella', 'guacamole']],
    ['Meat & Seafood', ['chicken', 'beef', 'pork', 'steak', 'ground', 'turkey', 'bacon', 'sausage', 'ham', 'lamb', 'rib', 'roast', 'wing', 'drumstick', 'thigh', 'fish', 'salmon', 'shrimp', 'cod', 'tilapia', 'crab', 'lobster', 'scallop', 'mussel', 'clam', 'hot dog', 'burger', 'meatball', 'brisket', 'veal', 'duck', 'trout', 'halibut']],
    ['Snacks', ['chip', 'cracker', 'cookie', 'candy', 'chocolate', 'popcorn', 'pretzel', 'granola', 'nut', 'peanut', 'almond', 'cashew', 'walnut', 'pistachio', 'pecan', 'trail mix', 'gum', 'jerky', 'fruit snack', 'rice cake']],
    ['Produce', ['apple', 'banana', 'orange', 'lemon', 'lime', 'grape', '~strawberr', '~blueberr', '~raspberr', '~blackberr', '~cranberr', '~cherr', 'berry', 'melon', 'cantaloupe', 'pear', 'peach', 'plum', 'mango', 'pineapple', 'avocado', 'kiwi', 'grapefruit', 'pomegranate', '~tomato', '~potato', 'onion', 'garlic', 'ginger', 'carrot', 'celery', 'lettuce', 'spinach', 'kale', 'arugula', 'cabbage', 'broccoli', 'cauliflower', 'cucumber', 'zucchini', 'squash', 'pepper', 'mushroom', 'corn', 'asparagus', 'eggplant', 'beet', 'radish', 'leek', 'scallion', 'shallot', 'herb', 'basil', 'cilantro', 'parsley', 'mint', 'rosemary', 'thyme', 'dill', 'salad', 'coleslaw', 'bok choy', 'turnip', 'parsnip', 'fruit', 'veggie', 'vegetable', 'clementine', 'mandarin', 'apricot', 'fig', 'jalapeno', 'pea', 'sprout']]
  ];

  function norm(s) { return ' ' + s.toLowerCase().replace(/[^a-z]+/g, ' ').trim() + ' '; }
  function guess(name) {
    var n = norm(name);
    for (var r = 0; r < RULES.length; r++) {
      var kws = RULES[r][1];
      for (var k = 0; k < kws.length; k++) {
        var kw = kws[k];
        if (kw.charAt(0) === '~') { if (n.indexOf(' ' + kw.slice(1)) !== -1) return RULES[r][0]; }
        else if (n.indexOf(' ' + kw + ' ') !== -1 || n.indexOf(' ' + kw + 's ') !== -1 || n.indexOf(' ' + kw + 'es ') !== -1) return RULES[r][0];
      }
    }
    return 'Other';
  }

  var KEY = 'grocery-list-v1';
  var uid = function () { return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };

  function clean(it) {
    return {
      id: String(it.id || uid()),
      name: String(it.name || '').slice(0, 120),
      cat: CATS.indexOf(it.cat) !== -1 ? it.cat : 'Other',
      done: !!it.done,
      t: +it.t || 0,
      dt: +it.dt || 0,
      ex: !!it.ex
    };
  }

  function seed() {
    var base = Date.now() - 100000;
    var names = ['Bananas', 'Baby spinach', 'Chicken thighs', 'Sourdough bread', 'Greek yogurt', 'Frozen peas', 'Pasta sauce', 'Orange juice', 'Dish soap', 'Garlic', 'Eggs'];
    return names.map(function (n, i) {
      return { id: uid(), name: n, cat: guess(n), done: n === 'Garlic' || n === 'Eggs', t: base + i, dt: base + 50 + i, ex: true };
    });
  }

  var state = { rev: 0, items: [] };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && Array.isArray(p.items)) state = { rev: +p.rev || 0, items: p.items.map(clean) };
    } else { state.items = seed(); }
  } catch (e) { state.items = seed(); }

  var editingId = null, clearArm = false, clearTimer = null;
  var $list = document.getElementById('list');
  var $summary = document.getElementById('summary');
  var $form = document.getElementById('add');
  var $item = document.getElementById('item');
  var $cat = document.getElementById('cat');

  var optAuto = document.createElement('option'); optAuto.value = 'auto'; optAuto.textContent = 'Auto-sort into aisle'; $cat.appendChild(optAuto);
  CATS.forEach(function (c) { var o = document.createElement('option'); o.value = c; o.textContent = c; $cat.appendChild(o); });

  var CHECK = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var DOTS = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>';

  function h(tag, props) {
    var e = document.createElement(tag);
    props = props || {};
    for (var k in props) {
      if (k === 'class') e.className = props[k];
      else if (k === 'text') e.textContent = props[k];
      else if (k === 'html') e.innerHTML = props[k];
      else e.setAttribute(k, props[k]);
    }
    for (var i = 2; i < arguments.length; i++) if (arguments[i]) e.appendChild(arguments[i]);
    return e;
  }

  // ---- saving: this device always, plus the signed-in private store when available ----
  // Shared list: one document per item, so two people editing at once never overwrite each other.
  var col = null, chains = {}, canWrite = true;
  function q(id, fn) {
    var c = (chains[id] || Promise.resolve()).then(fn).catch(function () {});
    chains[id] = c;
  }
  function fields(it) { return { name: it.name, cat: it.cat, done: it.done, t: it.t, dt: it.dt }; }
  function rSet(it) { if (col) q(it.id, function () { return col.doc(it.id).set(fields(it)); }); }
  function rUpd(id, data) { if (col) q(id, function () { return col.doc(id).update(data); }); }
  function rDel(id) { if (col) q(id, function () { return col.doc(id).delete(); }); }
  function cacheLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function save() { state.rev = Date.now(); cacheLocal(); }

  var MIGRATED = KEY + '-shared';
  async function initRemote() {
    try {
      if (!window.claude || !window.claude.use) return;
      var db = await window.claude.use('db');
      if (!db) return;
      var user = await window.claude.use('user');
      if (user) {
        var w = await user.can('data.write');
        if (w === false) {
          canWrite = false;
          $item.disabled = true; $cat.disabled = true; $form.querySelector('.add').disabled = true;
        }
      }
      var c = db.collection('grocery_items');
      var first = true;
      c.onSnapshot(function (snap) {
        var items = snap.docs.map(function (d) { var o = d.data() || {}; o.id = d.id; return clean(o); });
        if (first) {
          first = false;
          col = c;
          // One time per device: move the list that was saved here into the shared list.
          var migrated = false;
          try { migrated = !!localStorage.getItem(MIGRATED); } catch (e) {}
          if (!migrated && canWrite) {
            var have = {};
            items.forEach(function (i) { have[i.id] = 1; });
            state.items.forEach(function (i) {
              if (!i.ex && !have[i.id]) { rSet(i); items.push(i); }
            });
            try { localStorage.setItem(MIGRATED, '1'); } catch (e) {}
          }
        }
        state.items = items;
        cacheLocal();
        render();
      }, function () {});
    } catch (e) {}
  }

  // ---- rendering ----
  function section(title, items, isDone) {
    var head = h('div', { class: 'sign' + (isDone ? ' done' : '') }, h('span', { text: title }));
    if (isDone && items.length) {
      var right = h('span', { class: 'n', text: String(items.length) });
      var wrap = h('span', { style: 'display:flex;align-items:center;gap:12px' }, right,
        h('button', { type: 'button', class: 'clear' + (clearArm ? ' arm' : ''), 'data-act': 'clearcart', text: clearArm ? 'Tap again to clear' : 'Clear' }));
      head.appendChild(wrap);
    } else if (!isDone) {
      head.appendChild(h('span', { class: 'n', text: String(items.length) }));
    }
    var ul = h('ul');
    items.forEach(function (it) {
      var li = h('li');
      var row = h('div', { class: 'row' + (it.done ? ' done' : '') },
        h('button', { type: 'button', class: 'hit', 'data-act': 'toggle', 'data-id': it.id, 'aria-label': (it.done ? 'Put back on list: ' : 'Mark picked up: ') + it.name },
          h('span', { class: 'chk', html: CHECK })),
        h('span', { class: 'name', text: it.name }),
        it.done ? h('span', { class: 'tag', text: it.cat }) : null,
        h('button', { type: 'button', class: 'more', 'data-act': 'edit', 'data-id': it.id, 'aria-label': 'Edit ' + it.name, 'aria-expanded': editingId === it.id ? 'true' : 'false', html: DOTS })
      );
      li.appendChild(row);
      if (editingId === it.id) {
        var sel = h('select', { class: 'field', 'data-act': 'setcat', 'data-id': it.id, 'aria-label': 'Aisle for ' + it.name });
        CATS.forEach(function (c) { sel.appendChild(h('option', { value: c, text: c })); });
        sel.value = it.cat;
        li.appendChild(h('div', { class: 'edit' }, sel,
          h('button', { type: 'button', class: 'del', 'data-act': 'del', 'data-id': it.id, text: 'Remove' }),
          h('button', { type: 'button', 'data-act': 'edit', 'data-id': it.id, text: 'Done' })));
      }
      ul.appendChild(li);
    });
    return h('section', { class: 'aisle' }, head, ul);
  }

  function render() {
    var todo = state.items.filter(function (i) { return !i.done; });
    var got = state.items.filter(function (i) { return i.done; });
    $summary.textContent = !state.items.length ? '' : todo.length ? todo.length + ' to get · ' + got.length + ' picked up' : 'All picked up';
    $list.replaceChildren();

    if (!canWrite) {
      $list.appendChild(h('p', { class: 'hint', text: 'View only. You can see this list but not change it.' }));
    }
    if (state.items.some(function (i) { return i.ex; })) {
      $list.appendChild(h('p', { class: 'hint' }, h('span', { text: 'These are example items.' }),
        h('button', { type: 'button', class: 'link', 'data-act': 'clearex', text: 'Remove examples' })));
    }
    if (!todo.length) {
      $list.appendChild(h('p', { class: 'empty', text: state.items.length ? 'Everything on your list is picked up.' : 'Your list is empty. Add an item above.' }));
    }
    CATS.forEach(function (c) {
      var its = todo.filter(function (i) { return i.cat === c; }).sort(function (a, b) { return a.t - b.t; });
      if (its.length) $list.appendChild(section(c, its, false));
    });

    got.sort(function (a, b) { return b.dt - a.dt; });
    if (got.length) $list.appendChild(section('Picked up', got, true));
    else $list.appendChild(h('section', { class: 'aisle' }, h('div', { class: 'sign done' }, h('span', { text: 'Picked up' })),
      h('ul', null, h('li', null, h('p', { class: 'empty', style: 'margin:0;padding:18px 12px', text: 'Items you check off move down here.' })))));
  }

  // ---- actions ----
  function find(id) { for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i]; return null; }

  $list.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b || b.tagName === 'SELECT') return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id'), it = id ? find(id) : null;
    if (!canWrite) return;
    if (act === 'toggle' && it) {
      it.done = !it.done; it.dt = Date.now();
      if (editingId === id) editingId = null;
      rUpd(id, { done: it.done, dt: it.dt });
      save(); render();
    } else if (act === 'edit' && it) {
      editingId = editingId === id ? null : id; render();
    } else if (act === 'del' && it) {
      state.items = state.items.filter(function (x) { return x.id !== id; });
      rDel(id);
      editingId = null; save(); render();
    } else if (act === 'clearex') {
      state.items = state.items.filter(function (x) { return !x.ex; });
      save(); render();
    } else if (act === 'clearcart') {
      if (!clearArm) {
        clearArm = true; render();
        clearTimeout(clearTimer);
        clearTimer = setTimeout(function () { clearArm = false; render(); }, 3000);
      } else {
        clearTimeout(clearTimer); clearArm = false;
        state.items.filter(function (x) { return x.done; }).forEach(function (x) { rDel(x.id); });
        state.items = state.items.filter(function (x) { return !x.done; });
        save(); render();
      }
    }
  });

  $list.addEventListener('change', function (ev) {
    var s = ev.target.closest('[data-act="setcat"]');
    if (!s || !canWrite) return;
    var it = find(s.getAttribute('data-id'));
    if (it && CATS.indexOf(s.value) !== -1) { it.cat = s.value; rUpd(it.id, { cat: it.cat }); editingId = null; save(); render(); }
  });

  $form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!canWrite) return;
    var parts = $item.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!parts.length) return;
    var chosen = $cat.value;
    var base = Date.now();
    parts.forEach(function (p, i) {
      var name = p.charAt(0).toUpperCase() + p.slice(1);
      var ni = { id: uid(), name: name.slice(0, 120), cat: chosen === 'auto' ? guess(name) : chosen, done: false, t: base + i, dt: 0, ex: false };
      state.items.push(ni);
      rSet(ni);
    });
    $item.value = '';
    $cat.value = 'auto';
    save(); render();
    $item.focus();
  });

  render();
  initRemote();
})();
</script>

</body></html>
